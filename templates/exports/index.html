{% extends "base.html" %}
{% block title %}خروجی{% endblock %}
{% block content %}
<div class="row-between">
  <h1 class="page-title">خروجی — {{ p.name }}</h1>
  <a class="btn" href="{{ url_for('projects.detail', project_id=p.id) }}">بازگشت</a>
</div>
<div class="card grid-2">
  <a class="btn" href="{{ url_for('exports.download', project_id=p.id, kind='wp-content') }}">دانلود wp-content.zip</a>
  <a class="btn" href="{{ url_for('exports.download', project_id=p.id, kind='theme') }}">دانلود theme.zip</a>
  <a class="btn" href="{{ url_for('exports.download', project_id=p.id, kind='plugins') }}">دانلود plugins.zip</a>
  <a class="btn" href="{{ url_for('exports.download', project_id=p.id, kind='report') }}">گزارش HTML</a>
</div>
{% endblock %}
